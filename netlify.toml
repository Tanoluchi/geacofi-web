[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.23.4
  NODE_VERSION = "24"

# Hashed build assets never change: cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
