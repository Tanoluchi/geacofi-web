<!-- @dsCard group="Contenido" height=420 subtitle="Lado A · calientes" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Nunito:wght@400;800;900&family=Barlow+Condensed:ital,wght@1,700;1,800&family=DM+Mono:wght@400;500&display=swap"><style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-body)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;box-sizing:border-box;padding:10px 24px;border:var(--border-ink) solid var(--border);border-radius:var(--radius-md);background:var(--terracota);color:var(--on-accent);font:italic 800 24px/1 var(--font-cond);text-decoration:none;box-shadow:var(--sticker);transform:rotate(-1.5deg);transition:transform .15s ease-out,box-shadow .15s ease-out;cursor:pointer}
.btn:hover{transform:rotate(0) translate(-2px,-2px);box-shadow:var(--sticker-hover)}
.btn:active{transform:translate(5px,5px);box-shadow:none}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.btn.ghost{background:var(--durazno);color:var(--bordo);transform:rotate(1.5deg)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
.tc{background:var(--surface-raised);color:var(--ink);border:var(--border-ink) solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--card);padding:24px;max-width:420px}
[data-theme="noche"] .tc{box-shadow:var(--card-noche)}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.disc{width:50px;height:50px;border-radius:50%;background:var(--carbon);color:var(--durazno);display:flex;align-items:center;justify-content:center;font:italic 800 24px var(--font-cond)}
[data-theme="noche"] .disc{background:var(--terracota)}
.side{font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.ttl{font:italic 800 34px/1 var(--font-cond);color:var(--heading);margin:0}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:10px 0;border-bottom:var(--border-dash) dashed var(--border)}
.row:last-child{border-bottom:0}
.row .n{font:13px var(--font-mono);color:var(--eyebrow);padding-top:3px}
.row b{display:block;font-weight:800;font-size:17px}
.row small{display:block;font-size:13px;color:var(--ink-muted)}
.row .p{font:16px var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}</style></head>
<body>
<div style="padding:24px"><section class="tc"><div class="hd"><span class="disc">A</span><div><span class="side">Lado A</span><h3 class="ttl">calientes</h3></div></div><div class="row"><span class="n">01</span><span><b>espresso</b><small>shot chiquito</small></span><span class="p">$ 3.700</span></div><div class="row"><span class="n">02</span><span><b>uno y uno</b><small>espresso + cortadito</small></span><span class="p">$ 4.100</span></div><div class="row"><span class="n">03</span><span><b>flat white</b><small>doble espresso + leche</small></span><span class="p">$ 5.000</span></div><div class="row"><span class="n">04</span><span><b>spicy orange</b><small>espresso + leche + choco picante + almíbar de naranja</small></span><span class="p">$ 5.500</span></div></section></div>
</body></html>
