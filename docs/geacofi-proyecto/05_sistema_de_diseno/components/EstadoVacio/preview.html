<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Nunito:wght@400;800;900&family=Barlow+Condensed:ital,wght@1,700;1,800&family=DM+Mono:wght@400;500&display=swap"><style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-body)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;box-sizing:border-box;padding:10px 24px;border:var(--border-ink) solid var(--border);border-radius:var(--radius-md);background:var(--terracota);color:var(--on-accent);font:italic 800 24px/1 var(--font-cond);text-decoration:none;box-shadow:var(--sticker);transform:rotate(-1.5deg);transition:transform .15s ease-out,box-shadow .15s ease-out;cursor:pointer}
.btn:hover{transform:rotate(0) translate(-2px,-2px);box-shadow:var(--sticker-hover)}
.btn:active{transform:translate(5px,5px);box-shadow:none}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.btn.ghost{background:var(--durazno);color:var(--bordo);transform:rotate(1.5deg)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
.ev{background:var(--crema);border:var(--border-ink) solid var(--bordo);border-radius:var(--radius-xl);box-shadow:var(--card);padding:24px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;max-width:720px}
.ev img{width:180px}
.ev h3{margin:0;font:700 46px/.9 var(--font-display);color:var(--terracota)}
.ev p{margin:8px 0 14px;font-size:16px;color:var(--ink)}
.toast{display:flex;gap:12px;align-items:center;background:var(--carbon);color:var(--crema);border-radius:16px;padding:10px 14px;max-width:360px}
.toast img{width:60px}</style></head>
<body>
<div style="padding:24px;display:flex;flex-direction:column;gap:22px"><div class="ev"><img src="/_blob/0322be17a22daa79f3a17dfda410c9f7" alt="La rana durmiendo una siesta"><div style="flex:1 1 280px"><h3>por ahora no hay eventos anunciados</h3><p>Seguinos en Instagram y te enterás del próximo antes que nadie.</p><a class="btn" href="#">seguir a @geacofi</a></div></div><div class="toast" role="status"><img src="/_blob/889b5245eb9c36d8105f6a3152c6d9b1" alt=""><div><div style="font:12px var(--font-mono);color:var(--ambar)">confirmación</div><b>¡listo! te respondemos pronto</b></div></div></div>
</body></html>
