<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Nunito:wght@400;800;900&family=Barlow+Condensed:ital,wght@1,700;1,800&family=DM+Mono:wght@400;500&display=swap"><style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-body)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;box-sizing:border-box;padding:10px 24px;border:var(--border-ink) solid var(--border);border-radius:var(--radius-md);background:var(--terracota);color:var(--on-accent);font:italic 800 24px/1 var(--font-cond);text-decoration:none;box-shadow:var(--sticker);transform:rotate(-1.5deg);transition:transform .15s ease-out,box-shadow .15s ease-out;cursor:pointer}
.btn:hover{transform:rotate(0) translate(-2px,-2px);box-shadow:var(--sticker-hover)}
.btn:active{transform:translate(5px,5px);box-shadow:none}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.btn.ghost{background:var(--durazno);color:var(--bordo);transform:rotate(1.5deg)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
.tk{background:var(--crema);border:var(--border-ink) solid var(--bordo);border-radius:var(--radius-xl);box-shadow:10px 10px 0 var(--bordo);display:flex;flex-wrap:wrap;overflow:hidden;max-width:820px}
.tk .l{flex:1 1 320px;padding:28px;display:flex;flex-direction:column;gap:12px}
.tk .ey{font:500 13px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--terracota)}
.tk h2{margin:0;font:700 64px/.82 var(--font-display);color:var(--terracota)}
.tk .city{font:italic 800 24px var(--font-cond);color:var(--bordo)}
.tk .pill{background:var(--carbon);color:var(--durazno);font:14px var(--font-mono);padding:8px 14px;border-radius:var(--radius-sm)}
.tk .r{flex:1 1 240px;min-height:240px;border-left:3px dashed var(--bordo);background:repeating-linear-gradient(45deg,var(--durazno) 0 14px,var(--crema) 14px 28px);display:flex;align-items:center;justify-content:center;font:13px var(--font-mono);color:var(--bordo)}</style></head>
<body>
<div style="padding:24px"><div class="tk"><div class="l"><span class="ey">Pasá cuando quieras</span><h2>9 de Julio 996</h2><span class="city">Corrientes Capital</span><div style="display:flex;gap:10px;flex-wrap:wrap"><span class="pill">mañana 7:00 → 13:00</span><span class="pill">tarde 17:00 → 21:00</span></div><div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:6px"><a class="btn" href="#"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-4A8 8 0 1 1 8.5 19z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z"/></svg>escribinos</a><a class="btn ghost" href="#">cómo llegar</a></div></div><div class="r">mapa de Google</div></div></div>
</body></html>
