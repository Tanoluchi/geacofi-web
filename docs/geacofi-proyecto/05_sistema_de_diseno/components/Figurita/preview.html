<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Nunito:wght@400;800;900&family=Barlow+Condensed:ital,wght@1,700;1,800&family=DM+Mono:wght@400;500&display=swap"><style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-body)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;box-sizing:border-box;padding:10px 24px;border:var(--border-ink) solid var(--border);border-radius:var(--radius-md);background:var(--terracota);color:var(--on-accent);font:italic 800 24px/1 var(--font-cond);text-decoration:none;box-shadow:var(--sticker);transform:rotate(-1.5deg);transition:transform .15s ease-out,box-shadow .15s ease-out;cursor:pointer}
.btn:hover{transform:rotate(0) translate(-2px,-2px);box-shadow:var(--sticker-hover)}
.btn:active{transform:translate(5px,5px);box-shadow:none}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.btn.ghost{background:var(--durazno);color:var(--bordo);transform:rotate(1.5deg)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
.fg{width:200px;height:284px;box-sizing:border-box;border:var(--border-ink) solid var(--bordo);border-radius:14px;padding:12px;display:flex;flex-direction:column;box-shadow:var(--drop)}
.fg .top{display:flex;justify-content:space-between;align-items:baseline;font:italic 800 17px/1 var(--font-cond)}
.fg .num{font:11px var(--font-mono);font-style:normal;opacity:.75}
.fg .art{flex:1;min-height:0;margin:8px 0;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:6%}
.fg .art img{max-height:100%;max-width:100%}
.fg .nm{font:700 30px/.9 var(--font-display)}
.fg .mt{font:11px var(--font-mono);margin-top:3px;opacity:.85}
.fg .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.fg .tg{font:800 10px/1 var(--font-body);padding:4px 7px;border-radius:var(--radius-pill)}
.holo{background-image:linear-gradient(115deg,rgba(0,0,0,0) 25%,rgba(255,92,180,.35) 40%,rgba(90,200,255,.35) 55%,rgba(140,255,170,.3) 68%,rgba(0,0,0,0) 82%)}</style></head>
<body>
<div style="display:flex;gap:18px;padding:24px;flex-wrap:wrap"><div class="fg" style="background-color:var(--tostador-komun);color:var(--carbon)"><div class="top"><span>Komún Tostadores</span><span class="num">#03</span></div><div class="art" style="background:rgba(255,255,255,.45)"><img src="/_blob/6d03182cd99846148c4ab676456b7785" alt=""></div><div class="nm">Etiopía</div><div class="mt">Etiopía</div><div class="tags"><span class="tg" style="background:var(--carbon);color:var(--tostador-komun)">Natural</span></div></div><div class="fg holo" style="background-color:var(--tostador-momo);color:var(--crema)"><div class="top"><span>MOMO</span><span class="num">#07</span></div><div class="art" style="background:rgba(255,255,255,.08)"><img src="/_blob/889b5245eb9c36d8105f6a3152c6d9b1" alt=""></div><div class="nm">Rift Guji</div><div class="mt">Guji, Etiopía · Natural</div><div class="tags"><span class="tg" style="background:var(--crema);color:var(--tostador-momo)">miel</span><span class="tg" style="background:var(--crema);color:var(--tostador-momo)">damascos</span><span class="tg" style="background:var(--crema);color:var(--tostador-momo)">floral</span></div></div><div class="fg" style="background-color:var(--tostador-motofeca);color:var(--carbon)"><div class="top"><span>La Motofeca</span><span class="num">#13</span></div><div class="art" style="background:rgba(255,240,200,.45)"><img src="/_blob/7c9b84b100c83566eb1e14f65880c0e3" alt=""></div><div class="nm">Motoblend</div><div class="mt">Blend de la casa</div><div class="tags"><span class="tg" style="background:var(--carbon);color:var(--tostador-motofeca)">Fusion</span></div></div></div>
